name: eval-smoke

# Offline checks only: security regression suite + evaluation-framework tests.
# No LLM keys or database needed. The agent-level evaluation (eval/run_agent_eval.py)
# costs tokens, so it is run manually and compared with eval/compare.py.
on:
  pull_request:
  push:                    # every branch, so work is checked before a PR exists
  workflow_dispatch:       # and "Run workflow" from the Actions tab

concurrency:
  group: eval-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7
        ports: ["6390:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Security guards (SQL read-only + code sandbox, subprocess backend)
        run: uv run pytest tests/test_security_guards.py -q
      - name: Evaluation framework
        run: uv run pytest tests/test_eval_framework.py -q
      - name: Service layer (real Redis, stand-in graph)
        run: uv run pytest tests/test_service_store.py tests/test_service_api.py tests/test_service_observability.py tests/test_query_cache.py -q
      - name: Resilience, approval, triage, crash recovery
        run: uv run pytest tests/test_resilience.py tests/test_model_fallback.py tests/test_approval.py tests/test_request_triage.py tests/test_crash_recovery.py tests/test_kb_retrieval.py tests/test_citation_check.py tests/test_call_budget.py tests/test_memory_policy.py tests/test_loop_blocking.py tests/test_ci_coverage.py -q
